media:
  input: images
  output: images

content:
  - name: content
    label: Wedding Site
    type: file
    path: content.json
    format: json
    fields:
      - name: site
        label: Site basics
        type: object
        fields:
          - { name: monogram, label: Monogram text (top-left), type: string }
          - { name: monogramImage, label: "Monogram image — Home page (light/white)", type: image }
          - { name: monogramImageDark, label: "Monogram image — other pages (dark/black)", type: image }
          - { name: browserTitle, label: Browser tab title, type: string }
          - { name: tagline, label: Home tagline, type: string }
          - { name: heroImage, label: Home hero photo, type: image }
          - { name: heroAlt, label: Hero photo description, type: string }
          - { name: rsvpUrl, label: RSVP link (Zola / form URL), type: string }
          - { name: rsvpHidden, label: Hide RSVP buttons (nav + brown band), type: boolean }
          - { name: footer, label: Footer line, type: string }
          - name: navOrder
            label: Page order in the nav (drag to reorder)
            type: object
            list: true
            fields:
              - name: page
                label: Page
                type: select
                options:
                  values: [travel, things, schedule, registry, faq]
          - { name: bandHidden, label: Hide the brown band entirely, type: boolean }
          - { name: botanicalHidden, label: Hide just the botanical illustration, type: boolean }
          - { name: signoff, label: Sign-off line (brown band), type: string }
          - { name: botanical, label: Botanical illustration (optional), type: image }

      - name: schedule
        label: Schedule page
        type: object
        fields:
          - { name: hidden, label: Hide this page (WIP), type: boolean }
          - { name: title, label: "Big vertical word down the left (keep it one short word)", type: string }
          - { name: photo, label: Photo at the top (optional), type: image }
          - { name: photoAlt, label: Photo description, type: string }
          - name: days
            label: Days
            type: object
            list: true
            fields:
              - { name: date, label: "Date (e.g. JUL 30)", type: string }
              - { name: dow, label: "Day of week (e.g. FRIDAY)", type: string }
              - name: events
                label: Events (1 or 2 per day)
                type: object
                list: true
                fields:
                  - { name: name, label: Event name, type: string }
                  - { name: venue, label: Venue, type: string }
                  - { name: detail, label: "Second detail (attire, timing…)", type: string }
                  - { name: note, label: Small note underneath (optional), type: string }

      - name: rsvp
        label: RSVP page
        type: object
        fields:
          - { name: eyebrow, label: Small label above title, type: string }
          - { name: title, label: Page title, type: string }
          - { name: intro, label: Intro line, type: string }
          - { name: deadline, label: "Reply-by line (e.g. Kindly reply by June 1, 2027) — empty hides it", type: string }
          - { name: welcomeLabel, label: "Welcome-event question heading (asked first)", type: string }
          - { name: welcomeYes, label: "Welcome-event \"yes\" choice", type: string }
          - { name: welcomeNo, label: "Welcome-event \"no\" choice", type: string }
          - { name: weddingLabel, label: "Wedding question heading (asked second)", type: string }
          - { name: acceptLabel, label: "Wedding \"yes\" choice", type: string }
          - { name: declineLabel, label: "Wedding \"no\" choice", type: string }
          - { name: ftransLabel, label: "Friday transportation question (shown after a Friday yes)", type: string }
          - { name: stransLabel, label: "Saturday transportation question (shown after a wedding yes)", type: string }
          - { name: transYes, label: "Transportation \"yes\" choice", type: string }
          - { name: transNo, label: "Transportation \"no\" choice", type: string }
          - { name: thanksTitle, label: Confirmation title, type: string }
          - { name: thanksNote, label: Confirmation note, type: string }
          - { name: lockedNote, label: "Shown when a party already replied (how to reach you for changes)", type: string }
          - { name: video, label: "YouTube link that plays after replying (empty for none)", type: string }
          - { name: scriptUrl, label: "RSVP backend URL (Apps Script /exec — don't change casually)", type: string }

      - name: travel
        label: Travel page
        type: object
        fields:
          - { name: hidden, label: Hide this page (WIP), type: boolean }
          - { name: eyebrow, label: Small label above title, type: string }
          - { name: title, label: Page title, type: string }
          - { name: intro, label: Intro paragraph, type: text }
          - { name: photo, label: Getting-here photo, type: image }
          - { name: photoAlt, label: Photo description, type: string }
          - name: modes
            label: Getting-here rows
            type: object
            list: true
            fields:
              - { name: label, label: Small label (BY FERRY), type: string }
              - { name: route, label: Heading, type: string }
              - { name: body, label: Description, type: text }
              - { name: url, label: Link (optional — adds arrow), type: string }
          - { name: stayHidden, label: Hide the where-to-stay section, type: boolean }
          - { name: stayTitle, label: Stay section title, type: string }
          - { name: stayIntro, label: Stay intro paragraph, type: text }
          - { name: stayPhoto, label: Island photo, type: image }
          - { name: stayPhotoAlt, label: Photo description, type: string }
          - name: stays
            label: Places to stay
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: desc, label: Description, type: text }
              - { name: url, label: Link (optional — adds arrow), type: string }

      - name: things
        label: Things To Do page
        type: object
        fields:
          - { name: hidden, label: Hide this page (WIP), type: boolean }
          - { name: eyebrow, label: Small label above title, type: string }
          - { name: title, label: Page title, type: string }
          - { name: intro, label: Intro paragraph, type: text }
          - { name: favKey, label: "Star key text (shows when something is starred)", type: string }
          - name: sections
            label: Sections (Food & Drink, Activities, Sights…)
            type: object
            list: true
            fields:
              - { name: title, label: Section title, type: string }
              - { name: intro, label: Short intro line (optional), type: text }
              - { name: photo, label: Section photo (optional), type: image }
              - { name: photoAlt, label: Photo description, type: string }
              - name: items
                label: Rows
                type: object
                list: true
                fields:
                  - { name: name, label: Name, type: string }
                  - { name: desc, label: Description, type: text }
                  - { name: url, label: Link (optional — adds arrow), type: string }
                  - { name: fav, label: "Our fav (adds the spinning star)", type: boolean }

      - name: registry
        label: Registry page
        type: object
        fields:
          - { name: hidden, label: Hide this page (WIP), type: boolean }
          - { name: eyebrow, label: Small label above title, type: string }
          - { name: title, label: Page title, type: string }
          - { name: photo, label: Photo above title (optional), type: image }
          - { name: photoAlt, label: Photo description, type: string }
          - { name: note, label: Gift note, type: text }
          - { name: buttonLabel, label: Button text, type: string }
          - { name: registryUrl, label: Registry link, type: string }

      - name: faq
        label: FAQ page
        type: object
        fields:
          - { name: hidden, label: Hide this page (WIP), type: boolean }
          - { name: eyebrow, label: Small label above title, type: string }
          - { name: title, label: Page title, type: string }
          - name: items
            label: Questions
            type: object
            list: true
            fields:
              - { name: q, label: Question, type: string }
              - name: a
                label: "Answer — select text and use the link button to add a link"
                type: rich-text
                options: { format: html }
          - { name: photo, label: Photo at bottom (optional), type: image }
          - { name: photoAlt, label: Photo description, type: string }
